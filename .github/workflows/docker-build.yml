name: Docker Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - "ada/**"
      - "cpp/**"
      - "go/**"
      - "rust/**"
      - "entrypoint.sh"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [ main ]
    paths:
      - "ada/**"
      - "cpp/**"
      - "go/**"
      - "rust/**"
      - "entrypoint.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Ada image: built and tested natively on amd64 and arm64 runners (no QEMU).
  # The deprecated dev-container-ada-system image is no longer built here.
  # --------------------------------------------------------------------------
  ada:
    name: ada (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image (native ${{ matrix.arch }})
        run: docker build -f ada/Dockerfile -t dev-container-ada:ci .

      - name: Tool versions (dev-doctor)
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e HOST_USER="$(whoami)" \
            dev-container-ada:ci dev-doctor

      - name: Acceptance tests (A1-A9, I1-I4)
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e HOST_USER="$(whoami)" \
            -e RUN_ALT_COMPILER=1 \
            -v "${{ github.workspace }}/ada":/workspace \
            -w /workspace \
            dev-container-ada:ci \
            bash tests/acceptance.sh

      - name: Runtime identity tests (Docker)
        run: bash tests/identity.sh dev-container-ada:ci docker

      - name: Runtime identity tests (Podman keep-id)
        run: |
          docker save dev-container-ada:ci | podman load
          bash tests/identity.sh localhost/dev-container-ada:ci podman

      - name: Acceptance test A10 (offline build from prefetched dependencies)
        run: make -f ada/Makefile test-offline CONTAINER_CLI=docker IMAGE_NAME=dev-container-ada:ci

      - name: Export the package list
        run: |
          mkdir -p artifacts
          docker run --rm --entrypoint cat dev-container-ada:ci \
            /usr/share/doc/dev-containers/packages-${{ matrix.arch }}.txt \
            > artifacts/packages-${{ matrix.arch }}.txt
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e HOST_USER="$(whoami)" \
            dev-container-ada:ci dev-doctor > artifacts/dev-doctor-${{ matrix.arch }}.txt

      - name: Upload the package list and versions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ada-${{ matrix.arch }}-manifest
          path: artifacts/

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- C++ (upstream toolchain, amd64 + arm64) ----------------------
          - name: "cpp"
            image_name: "dev-container-cpp"
            dockerfile: "cpp/Dockerfile"
            lang_dir: "cpp"
            platforms: "linux/amd64,linux/arm64"
            build_args: ""
            workdir: "examples/hello_cpp"
            smoke_test: |
              set -e
              echo "=== Environment ==="
              echo "USER=$(whoami) UID=$(id -u) GID=$(id -g) HOME=$HOME"
              echo "DISPLAY_USER=$DISPLAY_USER"
              echo "CONTAINER_RUNTIME=$CONTAINER_RUNTIME"
              echo ""
              echo "=== Compile test (CMake + Ninja) ==="
              cmake -B build -G Ninja -DCMAKE_CXX_STANDARD=20
              cmake --build build
              echo ""
              echo "=== Run test ==="
              ./build/hello_cpp
              echo ""
              echo "=== Toolchain versions ==="
              gcc --version | head -1
              g++ --version | head -1
              clang --version | head -1
              cmake --version | head -1
              ninja --version
              arm-none-eabi-gcc --version | head -1
              echo "=== Smoke test passed ==="

          # ---- C++ (system toolchain, amd64 + arm64) ------------------------
          - name: "cpp-system"
            image_name: "dev-container-cpp-system"
            dockerfile: "cpp/Dockerfile.system"
            lang_dir: "cpp"
            platforms: "linux/amd64,linux/arm64"
            build_args: ""
            workdir: "examples/hello_cpp"
            smoke_test: |
              set -e
              echo "=== Environment ==="
              echo "USER=$(whoami) UID=$(id -u) GID=$(id -g) HOME=$HOME"
              echo "DISPLAY_USER=$DISPLAY_USER"
              echo "CONTAINER_RUNTIME=$CONTAINER_RUNTIME"
              echo ""
              echo "=== Compile test (CMake + Ninja) ==="
              cmake -B build -G Ninja -DCMAKE_CXX_STANDARD=20
              cmake --build build
              echo ""
              echo "=== Run test ==="
              ./build/hello_cpp
              echo ""
              echo "=== Toolchain versions ==="
              gcc --version | head -1
              g++ --version | head -1
              clang --version | head -1
              cmake --version | head -1
              ninja --version
              arm-none-eabi-gcc --version | head -1
              echo "=== Smoke test passed ==="

          # ---- Go (amd64 + arm64) -------------------------------------------
          - name: "go"
            image_name: "dev-container-go"
            dockerfile: "go/Dockerfile"
            lang_dir: "go"
            platforms: "linux/amd64,linux/arm64"
            build_args: ""
            workdir: "examples/hello_go"
            smoke_test: |
              set -e
              echo "=== Environment ==="
              echo "USER=$(whoami) UID=$(id -u) GID=$(id -g) HOME=$HOME"
              echo "DISPLAY_USER=$DISPLAY_USER"
              echo "CONTAINER_RUNTIME=$CONTAINER_RUNTIME"
              echo ""
              echo "=== Compile test (go build) ==="
              go build -o hello_go .
              echo ""
              echo "=== Run test ==="
              ./hello_go
              echo ""
              echo "=== Cross-compilation test ==="
              GOOS=darwin GOARCH=amd64 go build -o /dev/null .
              GOOS=darwin GOARCH=arm64 go build -o /dev/null .
              GOOS=linux GOARCH=arm64 go build -o /dev/null .
              GOOS=windows GOARCH=amd64 go build -o /dev/null .
              echo "Cross-compilation: PASSED"
              echo ""
              echo "=== Toolchain versions ==="
              go version
              gopls version 2>&1 | head -1
              dlv version 2>&1 | head -1
              staticcheck --version
              golangci-lint --version 2>&1 | head -1
              protoc --version
              buf --version
              echo "=== Smoke test passed ==="

          # ---- Rust (amd64 + arm64) -----------------------------------------
          - name: "rust"
            image_name: "dev-container-rust"
            dockerfile: "rust/Dockerfile"
            lang_dir: "rust"
            platforms: "linux/amd64,linux/arm64"
            build_args: ""
            workdir: "examples/hello_rust"
            smoke_test: |
              set -e
              echo "=== Environment ==="
              echo "USER=$(whoami) UID=$(id -u) GID=$(id -g) HOME=$HOME"
              echo "DISPLAY_USER=$DISPLAY_USER"
              echo "CONTAINER_RUNTIME=$CONTAINER_RUNTIME"
              echo ""
              echo "=== Compile test (cargo build) ==="
              cargo build 2>&1
              echo ""
              echo "=== Run test ==="
              cargo run 2>&1
              echo ""
              echo "=== Toolchain versions ==="
              rustc --version
              cargo --version
              rustup target list --installed | head -6
              probe-rs --version
              mold --version
              arm-linux-gnueabihf-gcc --version | head -1
              echo "=== Smoke test passed ==="

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image (${{ matrix.name }}, ${{ matrix.platforms }})
        run: |
          docker buildx build \
            --platform ${{ matrix.platforms }} \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.build_args }} \
            -t ${{ matrix.image_name }}:ci .

      - name: Load amd64 image for smoke test
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.build_args }} \
            -t ${{ matrix.image_name }}:ci .

      - name: Smoke test (${{ matrix.name }})
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e HOST_USER="$(whoami)" \
            -v "${{ github.workspace }}/${{ matrix.lang_dir }}":/workspace \
            -w /workspace/${{ matrix.workdir }} \
            ${{ matrix.image_name }}:ci \
            bash -c '${{ matrix.smoke_test }}'

      - name: Runtime identity tests (${{ matrix.name }})
        run: bash tests/identity.sh ${{ matrix.image_name }}:ci docker

      - name: vcpkg manifest install as the session user (cpp)
        if: matrix.name == 'cpp'
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e HOST_USER="$(whoami)" \
            -v "${{ github.workspace }}/cpp":/workspace -w /workspace \
            ${{ matrix.image_name }}:ci bash tests/vcpkg_manifest.sh
